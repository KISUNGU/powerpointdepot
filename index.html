<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>PowerPoint Depot — vos présentations Copilot</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20243a;
      background: #f5f6fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 85% 4%, #ecebff 0, transparent 32rem),
        #f5f6fa;
    }

    button, input { font: inherit; }

    .page {
      width: min(100% - 40px, 860px);
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #5550c8;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .brand-icon {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 11px;
      background: #625be7;
      color: white;
      box-shadow: 0 5px 14px #625be733;
    }

    h1 {
      max-width: 620px;
      margin: 42px 0 12px;
      font-size: clamp(2.15rem, 6vw, 3.35rem);
      line-height: 1.08;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 550px;
      margin: 0;
      color: #686d82;
      font-size: 16px;
      line-height: 1.65;
    }

    .panel {
      margin-top: 32px;
      padding: 24px;
      border: 1px solid #e8e9f1;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 35px #272b4710;
    }

    .panel h2, .list-heading h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.02em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr auto;
      align-items: end;
      gap: 14px;
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555a70;
      font-size: 12px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #dedfeb;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #20243a;
      font-size: 14px;
      transition: border-color .15s, box-shadow .15s;
    }

    input::placeholder { color: #a1a4b4; }
    input:focus { border-color: #7068ec; box-shadow: 0 0 0 3px #7068ec20; }

    .add-button {
      height: 46px;
      padding: 0 17px;
      border: 0;
      border-radius: 9px;
      background: #625be7;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
      white-space: nowrap;
    }

    .add-button:hover { background: #514bd0; }
    .add-button:active { transform: translateY(1px); }
    :focus-visible { outline: 3px solid #8e88ff; outline-offset: 3px; }

    .form-message {
      min-height: 20px;
      margin: 10px 0 0;
      color: #b4233b;
      font-size: 13px;
    }

    .list-section { margin-top: 34px; }
    .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .count {
      padding: 5px 10px;
      border-radius: 20px;
      background: #ecebff;
      color: #514bd0;
      font-size: 12px;
      font-weight: 750;
    }

    .link-list { display: grid; gap: 12px; margin-top: 16px; }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 18px;
      border: 1px solid #e8e9f1;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 4px 14px #272b4708;
    }

    .link-info { min-width: 0; }
    .link-title { overflow: hidden; margin: 0; font-size: 15px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .link-url { display: block; overflow: hidden; margin-top: 5px; color: #777b90; font-size: 12px; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
    .link-url:hover { color: #514bd0; text-decoration: underline; }

    .card-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }

    .open-link, .delete-link {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid #e8e9f1;
      border-radius: 9px;
      background: #fff;
      color: #686d82;
      cursor: pointer;
      text-decoration: none;
    }

    .open-link:hover { border-color: #c9c6ff; color: #514bd0; }
    .delete-link:hover { border-color: #ffd1d8; color: #c2364c; }
    .empty-state { padding: 34px 20px; border: 1px dashed #d9dbe8; border-radius: 13px; color: #777b90; text-align: center; }
    .empty-state strong { display: block; margin-bottom: 6px; color: #454a60; font-size: 14px; }
    .empty-state p { margin: 0; font-size: 13px; line-height: 1.5; }

    footer { margin-top: 32px; color: #9295a5; font-size: 12px; text-align: center; }

    @media (max-width: 680px) {
      .page { width: min(100% - 32px, 520px); padding-top: 28px; }
      h1 { margin-top: 34px; }
      .panel { padding: 19px; }
      .form-grid { grid-template-columns: 1fr; gap: 13px; }
      .add-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><span class="brand-icon" aria-hidden="true">▤</span> POWERPOINT DEPOT</div>
    <h1>Vos présentations, <span style="color:#625be7">au même endroit.</span></h1>
    <p class="intro">Rassemblez ici les liens de vos PowerPoint créés avec Copilot. Ajoutez un lien pour le retrouver facilement, quand vous en avez besoin.</p>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Ajouter une présentation</h2>
      <form id="link-form" novalidate>
        <div class="form-grid">
          <div>
            <label for="link-title">Nom de la présentation</label>
            <input id="link-title" name="title" type="text" placeholder="Ex. Bilan du trimestre" maxlength="100" required>
          </div>
          <div>
            <label for="link-url">Lien PowerPoint</label>
            <input id="link-url" name="url" type="url" placeholder="https://..." required>
          </div>
          <button class="add-button" type="submit">＋ Ajouter le lien</button>
        </div>
        <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section class="list-section" aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">Mes présentations</h2>
        <span class="count" id="link-count">0 lien</span>
      </div>
      <div class="link-list" id="link-list" aria-live="polite"></div>
    </section>

    <footer>Vos liens sont enregistrés dans ce navigateur.</footer>
  </main>

  <script>
    const storageKey = "powerpointdepot.links";
    const form = document.querySelector("#link-form");
    const titleInput = document.querySelector("#link-title");
    const urlInput = document.querySelector("#link-url");
    const message = document.querySelector("#form-message");
    const list = document.querySelector("#link-list");
    const count = document.querySelector("#link-count");

    function loadLinks() {
      try {
        const links = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(links) ? links.filter(link =>
          link && typeof link.title === "string" && typeof link.url === "string"
        ) : [];
      } catch {
        return [];
      }
    }

    let links = loadLinks();

    function saveLinks() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(links));
        return true;
      } catch {
        message.textContent = "Impossible d’enregistrer vos liens dans ce navigateur.";
        return false;
      }
    }

    function renderLinks() {
      list.replaceChildren();
      count.textContent = `${links.length} ${links.length === 1 ? "lien" : "liens"}`;

      if (links.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        const heading = document.createElement("strong");
        heading.textContent = "Votre collection est encore vide";
        const text = document.createElement("p");
        text.textContent = "Ajoutez le lien d’une présentation Copilot pour la retrouver ici.";
        empty.append(heading, text);
        list.append(empty);
        return;
      }

      links.forEach((link, index) => {
        const card = document.createElement("article");
        card.className = "link-card";
        const info = document.createElement("div");
        info.className = "link-info";
        const title = document.createElement("h3");
        title.className = "link-title";
        title.textContent = link.title;
        const url = document.createElement("a");
        url.className = "link-url";
        url.href = link.url;
        url.target = "_blank";
        url.rel = "noopener noreferrer";
        url.textContent = link.url;
        url.setAttribute("aria-label", `Ouvrir ${link.title}`);
        info.append(title, url);

        const actions = document.createElement("div");
        actions.className = "card-actions";
        const open = document.createElement("a");
        open.className = "open-link";
        open.href = link.url;
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        open.setAttribute("aria-label", `Ouvrir ${link.title} dans un nouvel onglet`);
        open.innerHTML = "↗";
        const remove = document.createElement("button");
        remove.className = "delete-link";
        remove.type = "button";
        remove.setAttribute("aria-label", `Supprimer ${link.title}`);
        remove.innerHTML = "×";
        remove.addEventListener("click", () => {
          links.splice(index, 1);
          if (saveLinks()) renderLinks();
        });
        actions.append(open, remove);
        card.append(info, actions);
        list.append(card);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      message.textContent = "";
      const title = titleInput.value.trim();
      const rawUrl = urlInput.value.trim();
      let url;

      try {
        url = new URL(rawUrl);
      } catch {
        message.textContent = "Saisissez un lien valide commençant par https://.";
        urlInput.focus();
        return;
      }

      if (!title) {
        message.textContent = "Ajoutez un nom pour retrouver votre présentation.";
        titleInput.focus();
        return;
      }
      if (url.protocol !== "https:" && url.protocol !== "http:") {
        message.textContent = "Le lien doit commencer par https:// ou http://.";
        urlInput.focus();
        return;
      }

      links.unshift({ title, url: url.href });
      if (saveLinks()) {
        form.reset();
        renderLinks();
        titleInput.focus();
      } else {
        links.shift();
      }
    });

    renderLinks();
  </script>
</body>
</html>
